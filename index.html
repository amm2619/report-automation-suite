<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sprint Planner</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%237c3aed'/><text x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-family='system-ui,sans-serif' font-size='17' font-weight='800' fill='%23f0f4f8'>SP</text></svg>">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app-shell">

  <!-- ═══ Header ══════════════════════════════════════════════════════════ -->
  <header class="app-header">
    <div class="app-logo"><em>Sprint</em> Planner</div>
    <div class="header-spacer"></div>
    <div class="header-actions">
      <button class="btn btn-sm" onclick="exportData()">↓ Export</button>
      <label class="btn btn-sm" style="cursor:pointer">
        ↑ Import
        <input type="file" id="import-input" accept=".json" style="display:none">
      </label>
      <button class="btn btn-sm btn-danger"
              onclick="if(confirm('Reset all data?')){localStorage.removeItem('vp2.v1');location.reload()}">
        Reset
      </button>
    </div>
  </header>

  <!-- ═══ Sidebar nav ══════════════════════════════════════════════════════ -->
  <nav class="app-nav">

    <button class="nav-btn active" data-section="planner" onclick="goTo('planner')">
      <span class="nav-icon">📋</span> Planner
    </button>
    <button class="nav-btn" data-section="team" onclick="goTo('team')">
      <span class="nav-icon">👥</span> Team
    </button>
    <button class="nav-btn" data-section="history" onclick="goTo('history')">
      <span class="nav-icon">📈</span> History
    </button>
    <button class="nav-btn" data-section="settings" onclick="goTo('settings')">
      <span class="nav-icon">⚙</span> Settings
    </button>

    <div class="nav-divider"></div>
    <div class="nav-section-label">Data</div>

    <div class="nav-upload-btns">
      <label class="nav-upload-btn" title="Import a historical Jira HTML export to calculate velocity">
        <span>📂</span> Historical HTML
        <input type="file" id="hist-input" accept=".html,.htm" style="display:none">
      </label>
      <label class="nav-upload-btn" title="Import the current sprint backlog as a Jira HTML export">
        <span>📂</span> Backlog HTML
        <input type="file" id="backlog-input" accept=".html,.htm" style="display:none">
      </label>
      <label class="nav-upload-btn" title="Import iCalendar (.ics) leave file">
        <span>📅</span> iCal Leave
        <input type="file" id="ical-input" accept=".ics,.ical" style="display:none">
      </label>
    </div>

  </nav>

  <!-- ═══ Main ═════════════════════════════════════════════════════════════ -->
  <main class="app-main">

    <!-- ─── Project tabs (top-level DX / LX / RC filter) ────────────────── -->
    <div class="project-tabs" id="project-tabs"></div>

    <!-- ─── Planner ─────────────────────────────────────────────────────── -->
    <div class="section-panel" data-section="planner">
      <div class="planner-toolbar">
        <div class="sprint-tabs" id="sprint-tabs"></div>
        <div class="mode-toggle">
          <button class="mode-btn active" data-mode="single" onclick="setMode('single')">Single</button>
          <button class="mode-btn" data-mode="multi" onclick="setMode('multi')">Multi</button>
        </div>
      </div>
      <div id="planner-content"></div>
    </div>

    <!-- ─── Team ────────────────────────────────────────────────────────── -->
    <div class="section-panel hidden" data-section="team">
      <div class="section-header">
        <div class="section-title">Team Members</div>
        <button class="btn btn-prime btn-sm" onclick="openPersonModal(null)">+ Add Person</button>
      </div>
      <div id="team-list"></div>
    </div>

    <!-- ─── History ─────────────────────────────────────────────────────── -->
    <div class="section-panel hidden" data-section="history">
      <div class="section-header">
        <div class="section-title">Velocity History</div>
      </div>
      <div id="history-content"></div>
    </div>

    <!-- ─── Settings ────────────────────────────────────────────────────── -->
    <div class="section-panel hidden" data-section="settings">
      <div class="section-header">
        <div class="section-title">Settings</div>
        <button class="btn btn-prime btn-sm" onclick="saveSettings()">Save</button>
      </div>
      <div class="settings-body">

        <!-- ── Left column: sprint calendar (tallest group) ──────────── -->
        <div class="settings-col">
          <div class="settings-group">
            <div class="settings-group-title">Sprint Calendar</div>

            <!-- Locked sprint list -->
            <div class="cfg-row">
              <label class="cfg-label">Locked sprints
                <span class="cfg-hint" style="font-weight:400;margin-left:6px">Dates are fixed regardless of default duration</span>
              </label>
              <div id="cfg-sprint-list"></div>
            </div>

            <!-- Add sprint form -->
            <div class="cfg-row">
              <label class="cfg-label">Add a locked sprint</label>
              <div class="add-sprint-row">
                <div class="add-sprint-field">
                  <label class="cfg-hint">Name <span style="font-weight:400">(optional)</span></label>
                  <input class="cfg-input" type="text" id="asd-name" placeholder="e.g. 26.3.1"
                         style="width:130px">
                </div>
                <div class="add-sprint-field">
                  <label class="cfg-hint">Start date</label>
                  <input class="cfg-input" type="date" id="asd-start">
                </div>
                <div class="add-sprint-field">
                  <label class="cfg-hint">Duration (calendar days)</label>
                  <input class="cfg-input" type="number" id="asd-dur" min="1" max="90" value="14"
                         style="width:90px">
                </div>
                <button type="button" class="btn btn-prime btn-sm" onclick="addSprint()"
                        style="align-self:flex-end">+ Add Sprint</button>
              </div>
            </div>

            <!-- Hidden inputs kept for saveSettings() state compatibility -->
            <input type="hidden" id="cfg-dur" value="14">
            <input type="hidden" id="cfg-future" value="0">
          </div>
        </div>

        <!-- ── Right column: jira, resolutions, leave ────────────────── -->
        <div class="settings-col">
          <div class="settings-group">
            <div class="settings-group-title">Jira Integration</div>
            <div class="cfg-row" style="margin-bottom:0">
              <label class="cfg-label">Jira Base URL</label>
              <input class="cfg-input" type="url" id="cfg-jira"
                     placeholder="https://your-org.atlassian.net">
              <div class="cfg-hint">Ticket keys become clickable links to Jira.</div>
            </div>
          </div>

          <div class="settings-group">
            <div class="settings-group-title">Done Resolutions</div>
            <div class="cfg-row">
              <label class="cfg-label">Tickets with these resolutions count as completed</label>
              <div id="cfg-res-list" class="res-list"></div>
            </div>
            <div class="cfg-row" style="margin-bottom:0">
              <label class="cfg-label">Additional resolutions (comma-separated)</label>
              <input class="cfg-input" type="text" id="cfg-res-custom"
                     placeholder="e.g. Accepted, Released">
            </div>
          </div>

          <div class="settings-group">
            <div class="settings-group-title">Leave Import Options</div>
            <div class="cfg-row" style="margin-bottom:0">
              <label class="cfg-label" style="display:flex;align-items:center;gap:8px;cursor:pointer">
                <input type="checkbox" id="cfg-half-day"
                       onchange="S.leaveHalfDay=this.checked;save()">
                Treat imported iCal events as half days (0.5 day each)
              </label>
              <div class="cfg-hint">Toggle before importing. Re-import to update existing leave records.</div>
            </div>
          </div>
        </div>

      </div>
    </div>

  </main><!-- /app-main -->

</div><!-- /app-shell -->

<!-- ═══ Description slide-in panel ══════════════════════════════════════════ -->
<div id="desc-panel" class="desc-panel hidden">
  <div class="desc-panel-head">
    <div>
      <div id="desc-key"></div>
      <div id="desc-summary"></div>
    </div>
    <button class="desc-close" onclick="closeDesc()" title="Close">✕</button>
  </div>
  <div class="desc-panel-body" id="desc-body"></div>
</div>

<!-- ═══ Person modal ═════════════════════════════════════════════════════════ -->
<div id="person-modal" class="modal-bg hidden" onclick="if(event.target===this)closePersonModal()">
  <div class="modal">
    <button class="modal-close" onclick="closePersonModal()">✕</button>
    <div class="modal-title" id="pm-title">Add Person</div>

    <form id="person-form" autocomplete="off">
      <input type="hidden" id="pm-id">

      <div class="form-row full">
        <div class="form-field">
          <label class="form-label" for="pm-name">Full name *</label>
          <input class="form-input" type="text" id="pm-name" required
                 placeholder="As it appears in Jira Assignee field">
        </div>
      </div>

      <div class="form-row">
        <div class="form-field">
          <label class="form-label" for="pm-sid">
            SID
            <span style="font-weight:400;font-size:0.7rem;color:var(--dim)">(from iCal mailto:)</span>
          </label>
          <input class="form-input" type="text" id="pm-sid"
                 placeholder="e.g. jsmith">
        </div>
        <div class="form-field">
          <label class="form-label" for="pm-type">Type</label>
          <select class="form-input" id="pm-type">
            <option value="gov">Government (GOV)</option>
            <option value="contractor">Contractor (CTR)</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-field">
          <label class="form-label" for="pm-project">Primary project</label>
          <select class="form-input" id="pm-project">
            <option value="">— None —</option>
            <option value="DX">DX</option>
            <option value="LX">LX</option>
            <option value="RC">RC</option>
          </select>
        </div>
        <div class="form-field">
          <label class="form-label" for="pm-goal">
            Goal points
            <span style="font-weight:400;font-size:0.7rem;color:var(--dim)">(used until 2+ sprint history)</span>
          </label>
          <input class="form-input" type="number" id="pm-goal" min="0" step="1" placeholder="e.g. 20">
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn" onclick="closePersonModal()">Cancel</button>
        <button type="submit" class="btn btn-prime">Save</button>
      </div>
    </form>
  </div>
</div>

<!-- ═══ Scripts (load order matters: deps before app) ════════════════════════ -->
<script src="holidays.js"></script>
<script src="ical.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>

<!-- Wire up backlog file input (not in app.js DOMContentLoaded to keep nav clean) -->
<script>
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('backlog-input').addEventListener('change', e => {
    const f = e.target.files[0];
    if (f) readFile(f, handleBacklogHTML);
    e.target.value = '';
  });
  document.getElementById('cfg-half-day').checked = S.leaveHalfDay || false;
});
</script>

</body>
</html>
