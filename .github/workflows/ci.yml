name: CI

on:
  push:
  pull_request:

jobs:
  smoke:
    name: Smoke test (parsers + sample data)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Run smoke test
        run: npm test
